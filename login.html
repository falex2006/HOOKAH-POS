<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hookah POS — Вход</title><link rel="stylesheet" href="/style.css?rev=402"><link rel="stylesheet" href="/auth-smoke.css?rev=2" data-auth-smoke="true"><!-- Hookah POS brand icons -->

<body><div class="login"><div class="auth-smoke-backdrop" aria-hidden="true"><span class="auth-smoke-texture"></span><span class="auth-smoke-light"></span><span class="auth-smoke-vignette"></span></div><form class="login-card" id="login-form" autocomplete="off" data-form-type="other" data-lpignore="true" data-1p-ignore="true" data-bwignore="true"><picture class="auth-product-brand"><source media="(prefers-reduced-motion:reduce)" srcset="/assets/brand/hookah-pos-lockup.svg?rev=2"><img src="/assets/brand/hookah-pos-lockup-animated.svg?rev=2" width="200" height="64" alt="Hookah POS by AlphaSat"></picture><h1>Добро пожаловать</h1><p>Рабочее пространство кальян-бара</p><label>Логин<input id="login-username" name="login_id" autocomplete="off" autocapitalize="none" spellcheck="false" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" placeholder="Введите логин" required></label><label class="login-password-field">Пароль<div class="login-password-wrap"><input id="login-password" name="login_secret" type="password" autocomplete="current-password" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" placeholder="Введите пароль" required><button id="login-password-toggle" class="login-password-toggle" type="button" aria-label="Показать пароль" aria-pressed="false">Показать</button></div></label><label class="login-trust-device"><input id="login-trust-device" type="checkbox" checked><span>Запомнить это устройство</span></label><button class="primary" type="submit">Войти в систему</button><p id="login-message" class="login-message"></p></form><form class="login-card password-reset-card" id="password-reset-form" hidden autocomplete="off" data-form-type="other"><picture class="auth-product-brand"><source media="(prefers-reduced-motion:reduce)" srcset="/assets/brand/hookah-pos-lockup.svg?rev=2"><img src="/assets/brand/hookah-pos-lockup-animated.svg?rev=2" width="200" height="64" alt="Hookah POS by AlphaSat"></picture><p class="login-kicker">ВОССТАНОВЛЕНИЕ ДОСТУПА</p><h1>Задайте новый пароль</h1><p>Ссылка одноразовая и действует ограниченное время.</p><label>Новый пароль<input id="reset-password" name="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Не менее 8 символов"></label><label>Повторите пароль<input id="reset-password-confirm" type="password" minlength="8" autocomplete="new-password" required placeholder="Введите пароль ещё раз"></label><button class="primary" id="reset-password-submit" type="submit">Сохранить новый пароль</button><a class="password-reset-back" href="/login" id="reset-password-back">Вернуться ко входу</a><p id="password-reset-message" class="login-message" role="status" aria-live="polite"></p></form><form class="login-card setup-card" id="setup-form" hidden autocomplete="off" data-form-type="other"><picture class="auth-product-brand"><source media="(prefers-reduced-motion:reduce)" srcset="/assets/brand/hookah-pos-lockup.svg?rev=2"><img src="/assets/brand/hookah-pos-lockup-animated.svg?rev=2" width="200" height="64" alt="Hookah POS by AlphaSat"></picture><p class="login-kicker">ПЕРВЫЙ ЗАПУСК</p><h1>Настройте заведение</h1><p>Создайте свою учётную запись администратора и начните с чистого пространства.</p><label>Название заведения<input id="setup-venue" autocomplete="off" required placeholder="Например, название вашего заведения"></label><label>Ваше имя<input id="setup-name" autocomplete="off" required placeholder="Имя владельца"></label><label>Город<input id="setup-city" autocomplete="off" placeholder="Город"></label><label>Логин<input id="setup-login" type="email" autocomplete="off" autocapitalize="none" required placeholder="admin@example.ru"></label><label>Пароль<div class="login-password-wrap"><input id="setup-password" type="password" autocomplete="new-password" minlength="8" required placeholder="Не менее 8 символов"><button id="setup-password-toggle" class="login-password-toggle" type="button">Показать</button></div></label><label>Часовой пояс<select id="setup-timezone"><option value="Asia/Yekaterinburg">Екатеринбург (UTC+5)</option><option value="Europe/Moscow">Москва (UTC+3)</option><option value="Asia/Novosibirsk">Новосибирск (UTC+7)</option><option value="Asia/Vladivostok">Владивосток (UTC+10)</option><option value="Asia/Krasnoyarsk">Красноярск (UTC+7)</option></select></label><button class="primary" type="submit">Создать и войти</button><p id="setup-message" class="login-message"></p></form></div><script src="/auth-smoke.js?rev=3" data-auth-smoke="true"></script><script src="login.js?rev=98"></script></body></html>
