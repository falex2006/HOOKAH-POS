server {
  listen 80;
  server_name _;
  if ($host != "212.192.0.58") { return 444; }
  server_tokens off;
  client_max_body_size 2m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://212.192.0.58$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name _;
  if ($host != "212.192.0.58") { return 444; }
  server_tokens off;
  client_max_body_size 2m;

  ssl_certificate /etc/letsencrypt/live/212.192.0.58/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/212.192.0.58/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:TLS:10m;
  ssl_session_tickets off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Keep one canonical URL per page, matching the previous HTTP behavior.
  location ~ ^(.+)/+$ {
    return 308 $1$is_args$args;
  }

  location / {
    proxy_pass http://crm:3000;
    proxy_set_header Host 212.192.0.58;
    proxy_set_header X-Forwarded-Host 212.192.0.58;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }
}
